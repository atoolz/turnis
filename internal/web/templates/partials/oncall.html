{{define "oncall_inner"}}
{{if .OnCall}}
<table>
    <thead>
        <tr>
            <th>Schedule</th>
            <th>On-call</th>
        </tr>
    </thead>
    <tbody>
        {{range .OnCall}}
        <tr>
            <td><a href="/schedules/{{.ScheduleID}}">{{.ScheduleName}}</a></td>
            <td>{{.UserName}}</td>
        </tr>
        {{end}}
    </tbody>
</table>
{{else}}
<p class="empty-state">No schedules configured.</p>
{{end}}
{{end}}
